# The JVM tiers (docs/TESTING.md) and the minified release build, on every push to main, every
# pull request, and by hand (Actions → JVM tests → Run workflow).
name: JVM tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: jvm-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21                         # Robolectric's API 36 framework needs 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic                    # MIT; the default "enhanced" one is proprietary,
                                                   # under Gradle's own terms of use
      # One framework per API level the tests run on (36; 33 for the layout tests). A cache found
      # under its key isn't saved again, so the key names the levels: change it with them.
      - name: Cache Robolectric's Android frameworks
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-api33-api36-${{ hashFiles('gradle/libs.versions.toml') }}

      # testDebugUnitTest and verifyRoborazziDebug run in every module that has them; lint runs from
      # :app over every module.
      # Once more after a minute when Gradle failed downloading a dependency or a plugin (a
      # repository answering 5xx, a connection reset or timing out): Google's Maven repository
      # answered 502 now and then, and API 34's job once failed so before any test ran. Any other
      # failure fails at once. The second run redoes only what didn't finish: the rest is up to date.
      - name: Run the JVM tiers and lint, and build the release APK
        run: |
          gradle() { ./gradlew :domain:test testDebugUnitTest verifyRoborazziDebug :app:lintDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; return "${PIPESTATUS[0]}"; }
          gradle && exit 0
          grep -qE 'Could not (resolve|GET|HEAD|download)|Received status code 5[0-9][0-9]|Connection reset|(Read|connect) timed out' \
            "$RUNNER_TEMP/gradle.log" || exit 1
          echo "::warning::Gradle failed to download something; running it once more in 60 s."
          sleep 60
          gradle

      - name: Upload the test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            */build/reports/tests/
            feature/*/build/reports/tests/
            feature/*/build/outputs/roborazzi/
            app/build/reports/lint-results-debug.html
          retention-days: 7                        # a failed run is looked into the same day
