# The instrumented tiers (docs/INSTRUMENTED-TESTS.md) on Android TV and Google TV emulators, one
# emulator per job, set up with android-tv-wsl-dev-tools as its CI.md describes. Started by hand
# only (Actions → Instrumented tests → Run workflow): emulator runs take many times the Actions
# minutes of the JVM tiers, and a private repository's minutes are limited.
#
# The choices are the tools' tested images from Luncher's minSdk (22) on: android_tv_api<level>
# and google_tv_api<level>. Each job's AVD gets that name too.
name: Instrumented tests

on:
  workflow_dispatch:
    inputs:
      emulators:
        description: Emulators to test on
        type: choice
        default: required-22-24-28-30-33-36
        options:
          - required-22-24-28-30-33-36             # the six in docs/INSTRUMENTED-TESTS.md; rename with that set
          - android-tv-all
          - google-tv-all
          - all
          - android_tv_api22
          - android_tv_api23
          - android_tv_api24
          - android_tv_api25
          - android_tv_api26
          - android_tv_api27
          - android_tv_api28
          - android_tv_api29
          - android_tv_api30
          - android_tv_api31
          - android_tv_api33
          - android_tv_api34
          - android_tv_api36
          - google_tv_api30
          - google_tv_api31
          - google_tv_api33
          - google_tv_api34
          - google_tv_api36

permissions:
  contents: read

jobs:
  connected-tests:
    name: ${{ matrix.avd }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        avd: ${{ fromJSON(
          inputs.emulators == 'required-22-24-28-30-33-36' && '["android_tv_api22", "android_tv_api24", "android_tv_api28", "android_tv_api30", "android_tv_api33", "android_tv_api36"]' ||
          inputs.emulators == 'android-tv-all' && '["android_tv_api22", "android_tv_api23", "android_tv_api24", "android_tv_api25", "android_tv_api26", "android_tv_api27", "android_tv_api28", "android_tv_api29", "android_tv_api30", "android_tv_api31", "android_tv_api33", "android_tv_api34", "android_tv_api36"]' ||
          inputs.emulators == 'google-tv-all' && '["google_tv_api30", "google_tv_api31", "google_tv_api33", "google_tv_api34", "google_tv_api36"]' ||
          inputs.emulators == 'all' && '["android_tv_api22", "android_tv_api23", "android_tv_api24", "android_tv_api25", "android_tv_api26", "android_tv_api27", "android_tv_api28", "android_tv_api29", "android_tv_api30", "android_tv_api31", "android_tv_api33", "android_tv_api34", "android_tv_api36", "google_tv_api30", "google_tv_api31", "google_tv_api33", "google_tv_api34", "google_tv_api36"]' ||
          format('["{0}"]', inputs.emulators)) }}
    env:
      AVD: ${{ matrix.avd }}
    steps:
      - uses: actions/checkout@v7                  # Luncher first: it empties the workspace
      - uses: actions/checkout@v7
        with:
          repository: CVasilakis/android-tv-wsl-dev-tools
          ref: v1.6.1
          path: .android-tv-wsl-dev-tools
      # adb too: the tools find it in the SDK by themselves, but the failure steps call it by name.
      - name: Put the tools and adb on PATH
        run: |
          echo "$GITHUB_WORKSPACE/.android-tv-wsl-dev-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Tell the system image from the AVD name
        run: |
          echo "API=${AVD##*_api}" >> "$GITHUB_ENV"
          case "$AVD" in
            google_tv_*) echo "TAG=google-tv" >> "$GITHUB_ENV" ;;
            *)           echo "TAG=android-tv" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic                    # see jvm-tests.yml
          cache-read-only: true                    # the JVM tests workflow keeps the cache

      # Built before the emulator boots, so compiling doesn't compete with the emulator's own
      # post-boot work for the runner's 2 cores; connectedDebugAndroidTest then only installs
      # and runs them.
      - name: Build the app and the test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # The emulator needs ~7.2 GB free to create the AVD's data partition, and after installing a
      # system image of 3 GB or more the runner has about that or less (API 26 and 27 were 65 MB
      # short). These preinstalled toolchains aren't used here.
      - name: Free disk space for the system image and the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk"
          df -h /

      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator's system library
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      # The TV images of API 26-30 (Android TV and Google TV) are under android-sdk-preview-license,
      # which the runner image doesn't accept. sdkmanager's output is mostly progress bars, so it's shown only on failure.
      # The system images aren't cached: together they would fill most of the repository's 10 GB
      # Actions cache and evict the Gradle cache.
      - name: Install the emulator and the system image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2> /dev/null | "$sdkmanager" --licenses > /dev/null   # yes: "Broken pipe" once it's done
          "$sdkmanager" "emulator" "platform-tools" "system-images;android-$API;$TAG;x86" \
            > "$RUNNER_TEMP/sdkmanager.log" || { cat "$RUNNER_TEMP/sdkmanager.log"; exit 1; }

      # --wait-for-home: Android has booted (sys.boot_completed) before the device has settled. On
      # API 34 the tests once started while no window had the focus, and none ever got it. It also
      # presses Back on "USB drive connected", which a new AVD's first boot opens on API 23 and 29.
      # The tests wait for the home screen themselves too (docs/INSTRUMENTED-TESTS.md), for runs
      # without the tools. Time limits: ADT_BOOT_TIMEOUT (900 s) for the boot, then ADT_HOME_TIMEOUT
      # (600 s).
      - name: Boot the emulator
        run: |
          google_tv=()
          if [ "$TAG" = google-tv ]; then google_tv=(--google-tv); fi
          create-avd.sh --api "$API" "${google_tv[@]}" --if-missing "$AVD"
          serial="$(start-emulator.sh --wait-for-home "$AVD" -no-snapshot-save)"
          echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"
      - name: Run the instrumented tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Show the emulator's log and the free disk space
        if: failure()
        run: |
          cat "${TMPDIR:-/tmp}/emulator-$AVD.log" || true
          df -h /
      # adb can fail without a message (AGP's test engine once got exit code 255 while the
      # emulator's log showed it running normally). adb's own server log records its side.
      - name: Show what adb sees, and the end of adb's server log
        if: failure()
        run: |
          timeout 15 adb devices -l || true
          adb_log="${TMPDIR:-/tmp}/adb.$(id -u).log"
          tail -n 100 "$adb_log" || true
          mkdir -p app/build
          cp "$adb_log" app/build/adb-server.log || true
      - name: Save the device log
        if: failure()
        run: timeout 30 adb logcat -d > app/build/logcat.txt || true
      # What was in front: the focused activity and window (mFocusedApp, mCurrentFocus; Espresso
      # sends keys only to a focused window of the app), every window, and the screen itself.
      - name: Save the windows and a screenshot
        if: failure()
        run: |
          mkdir -p app/build
          timeout 30 adb shell dumpsys window > app/build/windows.txt || true
          grep -E 'mCurrentFocus|mFocusedApp' app/build/windows.txt || true
          timeout 30 adb exec-out screencap -p > app/build/screen.png || true
      - name: Upload the test reports, the device's log, windows and screen, and adb's server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-reports-${{ matrix.avd }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/logcat.txt
            app/build/windows.txt
            app/build/screen.png
            app/build/adb-server.log
          retention-days: 7                        # so they don't fill a private repository's artifact storage
          if-no-files-found: ignore
