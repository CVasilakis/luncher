org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Keep Luncher installed after instrumented tests. Otherwise AGP uninstalls it, which leaves a
# device without a home screen when the stock launcher is disabled. (app/build.gradle.kts starts
# each run from a clean install, so leftovers don't matter.)
android.injected.androidTest.leaveApksInstalledAfterRun=true
